<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="converter">

        <div class="heading">
            <p>Temperature Tool</p>
            <h1>Temperature Converter</h1>
            <span>Convert temperatures between Celsius, Fahrenheit and Kelvin.</span>
        </div>

        <div class="form">

            <label for="temperature">Temperature</label>

            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature"
                step="any"
            >

            <label for="unit">Convert from</label>

            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <button id="convertBtn">Convert</button>

            <p id="error"></p>

        </div>

        <div class="results">

            <div class="result-box">
                <span>Celsius</span>
                <strong id="celsiusResult">-- °C</strong>
            </div>

            <div class="result-box">
                <span>Fahrenheit</span>
                <strong id="fahrenheitResult">-- °F</strong>
            </div>

            <div class="result-box">
                <span>Kelvin</span>
                <strong id="kelvinResult">-- K</strong>
            </div>

        </div>

    </main>

    <script src="react.js"></script>

</body>
</html>
